[project]
name = "forge-mcp"
version = "0.1.0"
description = "MCP server for game modding helpers (hex, offsets, PE, APK, Unity/Unreal, tables, archives)."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pefile>=2024.0.0",
    "capstone>=5.0.0",
    "unicorn>=2.0.0",
    "lief>=0.14.0",
    "pyelftools>=0.30",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
full = [
    "keystone-engine>=0.9.2",
    "UnityPy>=1.10.0",
    "kaitaistruct>=0.10",
    "androguard>=4.0.0",
    "lz4>=4.3.0",
]

[project.scripts]
forge-mcp = "forge_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]