name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Optional integrations are best-effort; tests for them skip when
          # the extra cannot be built on a runner.
          pip install -e .[full] || echo "optional full extras unavailable"
          # Test dependencies must be installed explicitly: the optional
          # `full` extra does not include pytest, so `.[full]` alone leaves
          # the test command unavailable.
          pip install -e .[dev]

      - name: Run tests
        run: python -m pytest -q